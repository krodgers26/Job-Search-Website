# ------------------------------------------------------------------
# Relevance scoring - your target role profile.
# Titles/descriptions are checked case-insensitively.
# ------------------------------------------------------------------
scoring:
  # Words/phrases that make a posting MORE relevant.
  # weight_title applies when the keyword appears in the job title.
  # weight_description applies when it only appears in the job description.
  priority_keywords:
    - phrase: "investor relations"
      weight_title: 8
      weight_description: 3
    - phrase: "lp relations"
      weight_title: 8
      weight_description: 3
    - phrase: "fund relations"
      weight_title: 8
      weight_description: 3
    - phrase: "esg"
      weight_title: 6
      weight_description: 2
    - phrase: "esg strategy"
      weight_title: 6
      weight_description: 2
    - phrase: "esg program"
      weight_title: 6
      weight_description: 2
    - phrase: "sustainability"
      weight_title: 6
      weight_description: 2
    - phrase: "responsible investing"
      weight_title: 6
      weight_description: 2
    - phrase: "responsible investment"
      weight_title: 6
      weight_description: 2
    - phrase: "responsible growth"
      weight_title: 6
      weight_description: 2
    - phrase: "product marketing"
      weight_title: 6
      weight_description: 2
    - phrase: "product specialist"
      weight_title: 6
      weight_description: 2
    - phrase: "stakeholder engagement"
      weight_title: 5
      weight_description: 2
    - phrase: "stakeholder relations"
      weight_title: 5
      weight_description: 2
    - phrase: "change management"
      weight_title: 5
      weight_description: 2
    - phrase: "transformation"
      weight_title: 5
      weight_description: 2
    - phrase: "engagement program"
      weight_title: 5
      weight_description: 2
    - phrase: "program design"
      weight_title: 5
      weight_description: 2

  # Bonus points if the firm type looks like PE / asset management / mission-driven.
  firm_type_bonus:
    - phrase: "private equity"
      weight: 2
    - phrase: "asset management"
      weight: 2

# ------------------------------------------------------------------
# Salary filter and scoring.
# Not every posting discloses a salary (Massachusetts requires it for many
# employers, but not everywhere else) - a posting where no salary could be
# found is never excluded or penalized for it, it's just scored without a
# salary bonus either way.
# ------------------------------------------------------------------
salary:
  target_min: 130000
  target_max: 200000
  # A posting whose disclosed range tops out at or below this is dropped
  # entirely, regardless of everything else about it.
  exclude_if_max_at_or_below: 120000
  # Points added when the disclosed range overlaps your target range at all.
  in_range_bonus: 10
  # Points added when it doesn't quite overlap but comes close - within
  # near_range_buffer dollars of either edge of your target range.
  near_range_bonus: 4
  near_range_buffer: 15000

# ------------------------------------------------------------------
# Recency scoring - newer postings get a boost so they rank higher even
# when an older posting scores similarly otherwise. List tiers with the
# smallest "within_days" first; the first (smallest/soonest) matching tier
# wins, so keep them in ascending order if you edit this.
# ------------------------------------------------------------------
recency:
  bonus_tiers:
    - within_days: 3
      bonus: 8
    - within_days: 7
      bonus: 5
    - within_days: 14
      bonus: 2

# ------------------------------------------------------------------
# Seniority filter.
# exclude_terms: if a title contains any of these, the posting is
#   hard-excluded from results (never shown).
# include_terms: if a title contains any of these, it gets a scoring bonus
#   and is treated as "at or above" your target level.
# Titles that match NEITHER list are still shown (score untouched) so you
# can eyeball them rather than silently losing anything ambiguous.
# ------------------------------------------------------------------
seniority:
  exclude_terms:
    - intern
    - internship
    - "analyst i"
    - "analyst 1"
    - coordinator
    - "administrative assistant"
    - receptionist
    - junior
  include_terms:
    - associate
    - "senior associate"
    - "vice president"
    - " vp "
    - director
    - principal
  include_bonus: 4

# ------------------------------------------------------------------
# Hard excludes - postings matching any of these in the TITLE are dropped
# entirely, regardless of score.
# ------------------------------------------------------------------
exclude_title_terms:
  - compliance
  - "general counsel"
  - paralegal
  - "legal counsel"
  - attorney

# ------------------------------------------------------------------
# Location filter.
# target_location_terms: any of these appearing in the posting's location
#   field counts as a location match (big score bonus).
# remote_terms: any of these counts as remote-friendly (smaller bonus).
# exclude_if_no_location_match: if true, postings that match NEITHER the
#   target location NOR a remote term are hard-excluded rather than just
#   scored low.
# ------------------------------------------------------------------
location:
  target_location_terms:
    - boston
    - massachusetts
    - " ma "
    - " ma,"
  remote_terms:
    - remote
    - hybrid
    - "work from home"
  target_location_bonus: 6
  remote_bonus: 2
  exclude_if_no_location_match: true

# ------------------------------------------------------------------
# Output settings.
# ------------------------------------------------------------------
output:
  html_path: output/jobs.html
  csv_path: output/jobs.csv
  write_csv: false
  # Postings with a score below this are still saved to history but
  # left out of the HTML/CSV report.
  min_score_to_show: 0

# ------------------------------------------------------------------
# Where the history database lives.
# ------------------------------------------------------------------
database:
  path: output/jobs.db
