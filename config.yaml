  - name: Audax Group
    platform: greenhouse
    board_id: audaxgroup

  - name: Summit Partners
    platform: greenhouse
    board_id: summitpartnerslp

  - name: General Catalyst
    platform: greenhouse
    board_id: generalcatalyst

  - name: HarbourVest Partners
    platform: workday
    tenant: harbourvest
    wd_host: wd5
    site: HVP

  - name: Bain Capital
    platform: workday
    tenant: baincapital
    wd_host: wd1
    site: External_Private

  - name: Advent International
    platform: workday
    tenant: adventinternational
    wd_host: wd12
    site: AdventAgency

  - name: Cambridge Associates
    platform: workday
    tenant: cambridgeassociates
    wd_host: wd5
    site: Cambridge_Associates

  - name: Wellington Management
    platform: workday
    tenant: wellington
    wd_host: wd5
    site: External

  - name: Fidelity Investments
    platform: workday
    tenant: fmr
    wd_host: wd1
    site: FidelityCareers
    # Fidelity's board spans the whole company (retail, tech, ops, etc.),
    # so narrow the fetch with a search term rather than pulling everything.
    # Change or add more Fidelity entries with different search_text values
    # to widen this later.
    search_text: "investor relations"

