# =============================================================================
# Job Search Aggregator - Configuration
# Edit this file to add/remove companies, tune keywords, and adjust filters.
# No coding needed - just edit the lists below and save.
# =============================================================================

# ------------------------------------------------------------------
# Companies to track.
# platform must be one of: greenhouse, lever, ashby, workday, rss
#
# How to find the IDs yourself for a new company:
#   Greenhouse: look for job-boards.greenhouse.io/<board_id> in the company's
#               careers page URL -> that <board_id> is what you need.
#   Lever:      look for jobs.lever.co/<board_id>.
#   Ashby:      look for jobs.ashbyhq.com/<board_id>.
#   Workday:    look for a URL like
#               https://<tenant>.wd#.myworkdayjobs.com/<site>
#               -> tenant, wd number, and site all go below.
#   RSS:        just paste the feed URL.
# ------------------------------------------------------------------
